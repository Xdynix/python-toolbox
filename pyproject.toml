[project]
name = "python-toolbox"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic[email]>=2.13.4",
]

[dependency-groups]
dev = [
    "rust-just>=1.58.0",
]
lint = [
    "mypy>=2.3,<3",
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
    "types-jsonschema>=4.26.0.20260518",
]
test = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.1.0",
]

[tool.uv]
required-version = ">=0.13.5"
default-groups = "all"
preview-features = ["audit-command"]

[tool.ruff]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "D", # pydocstyle
    "PGH", # pygrep-hooks
    "UP", # pyupgrade
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "DTZ", # flake8-datetimez
    "G", # flake8-logging-format
    "PT", # flake8-pytest-style
    "T", # flake8-debugger, flake8-print
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "FURB", # refurb
    "RUF", # Ruff-specific rules
]
ignore = [
    # Docstrings are optional; omit them when the name says it all.
    "D1", # undocumented-*
    # Conflict with the formatter.
    "W191", # tab-indentation
    "E111", # indentation-with-invalid-multiple
    "E114", # indentation-with-invalid-multiple-comment
    "E117", # over-indented
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # assert
    "S105", # hardcoded-password-string
]

[tool.mypy]
strict = true
enable_error_code = ["deprecated"]
cache_dir = ".cache/mypy"
mypy_path = "utilities"
num_workers = 8

[tool.pytest]
strict = true
cache_dir = ".cache/pytest"
pythonpath = ["utilities"]
testpaths = ["tests", "utilities"]
addopts = [
    "--doctest-modules",
    "--import-mode", "importlib",
    "--cov-config", "pyproject.toml",
    "--cov-report", "term:skip-covered",
    "--cov-report", "html",
    "--cov-fail-under", "100",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Quoted because pytest declares this option as a string.
max_warnings = "0"
filterwarnings = [
    # Python hides ResourceWarning by default; show it so unclosed files fail the run.
    "default::ResourceWarning",
]
markers = [
    "only: shorthand mark used to select a small subset of test cases for debugging",
]

[tool.coverage.run]
branch = true
data_file = ".cache/coverage/data.db"
disable_warnings = ["no-data-collected"]
omit = [
    "utilities/graceful.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@overload",
]

[tool.coverage.html]
directory = "var/cov-report"

[tool.markdownlint]
default = true
MD007 = { indent = 4 }
MD013 = { line_length = 88, strict = true, tables = false, code_blocks = false }
